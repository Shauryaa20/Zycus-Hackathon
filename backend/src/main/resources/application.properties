spring.application.name=stockpulse

# Server port
server.port=8080

# Database H2 configuration
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Execute data.sql after schema creation
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# LLM Config
llm.provider=gemini
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-3.6-flash
llm.base-url=https://generativelanguage.googleapis.com

# Commerce Strategy (rule-based | ai)
commerce.strategy=ai
